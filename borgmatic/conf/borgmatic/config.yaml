source_directories:
    - /mnt/source/srv
    - /mnt/source/etc
repositories:
    - path: ssh://u408911@u408911.your-storagebox.de:23/home/borg/bitters/repo
      label: hetzner
one_file_system: true

#   Passphase is set in varibable $BORG_PASSPHRASE
#   encryption_passphrase: "DoNotForgetToChangeYourPassphrase"
compression: zlib
archive_name_format: 'backup-{now}'

exclude_patterns:
  - '*/log/*'
  - '*/logs/*'
  - '*.log'
  - '*/cache/*'
  - '*.cache'

# Exclude directories that contain a CACHEDIR.TAG file. See
# http://www.brynosaurus.com/cachedir/spec.html for details. Defaults
# to false.
exclude_caches: true

# Exclude directories that contain a file with the given filenames.
# Defaults to not set.
exclude_if_present:
  - .nobackup


#keep_hourly: 2
keep_daily: 3
keep_weekly: 1
keep_monthly: 1
#keep_yearly: 10

checks:
  - name: repository
    frequency: 2 weeks
  - name: archives
    frequency: always
  - name: extract
    frequency: 2 weeks
  - name: data
    frequency: 1 month

apprise:
    states:
        #- start
        #- finish
        - fail

    services:
        - url: mailto://172.17.0.1?to=splitbrain@gmail.com&from=borgmatic@splitbrain.org
          label: mail

    start:
        title: "⚙️ Backup bitters: started"
        body: Starting backup process.

    finish:
        title: "✅ Backup bitters: SUCCESS"
        body: Backups successfully made.

    fail:
        title: "❌ Backup bitters: FAILED"
        body: Your backups have failed.

healthchecks:
    ping_url: https://hc-ping.com/5cad2c10-fd81-4435-bf44-1a707bc18fa5
