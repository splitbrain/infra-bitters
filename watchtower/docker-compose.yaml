services:
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_NOTIFICATION_URL: smtp://172.17.0.1:25/?fromaddress=watchtower@splitbrain.org&fromname=Watchtower&toaddresses=splitbrain@gmail.com&auth=None&skiptlsverify=Yes
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: bitters
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
      - /etc/localtime:/etc/localtime:ro
    command: --cleanup

    labels:
      traefik.enable: true
      traefik.http.routers.watchtower.rule: Host(`watchtower.splitbrain.net`)
      traefik.http.routers.watchtower.tls.certresolver: letsencrypt

    networks:
      - traefik

networks:
  traefik:
    name: traefik

