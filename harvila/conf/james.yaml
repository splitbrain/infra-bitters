server:
  listen: 0.0.0.0:8080
  base_path: /james
  allowed_origins:
    - https://booking.winkel-hausboote.de

auth:
  secret: ${JAMES_SECRET}

llm:
  provider: anthropic
  model: claude-opus-5
  api_key: ${JAMES_API_KEY}

agent:
  system_prompt: "@prompt.md"

tools:
  files:
    - path: /app
      exclude: [".git", "vendor", "node_modules", ".env*"]
    - path: /data
      exclude: ["framework", "*.sqlite*"]

  databases:
    main:
      driver: sqlite
      dsn: /data/database.sqlite

  browser:
    - read_page
    - read_dom
    - navigate
